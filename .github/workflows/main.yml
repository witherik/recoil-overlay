name: Build Recoil Practice

on:
  workflow_dispatch:
  push:
    branches:
      - release

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23.12'

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.1

      - name: Add Go bin to PATH
        run: echo "$env:USERPROFILE\\go\\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend for Go embed
        run: npm run build
        working-directory: frontend

      - name: Test Go
        run: go test ./...

      - name: Test frontend
        run: npm test
        working-directory: frontend

      - name: Build Windows amd64 app
        run: wails build -platform windows/amd64

      - name: List output files for debug
        run: dir build\bin

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: recoil-practice-windows-amd64
          path: build/bin/recoil-overlay.exe
