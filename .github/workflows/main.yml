name: Build

# A push or a pull request builds and tests the program.
# A tag that starts with "v" also publishes a release with the file.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.12'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.1

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend for Go embed
        run: npm run build
        working-directory: frontend

      - name: Test Go
        run: |
          go vet ./...
          go test ./...

      - name: Test frontend
        run: npm test
        working-directory: frontend

      - name: Build Windows amd64 app
        run: wails build -platform windows/amd64

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: recoil-practice-windows-amd64
          path: build/bin/recoil-overlay.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $hash = (Get-FileHash build\bin\recoil-overlay.exe -Algorithm SHA256).Hash.ToLower()
          gh release create $env:GITHUB_REF_NAME build/bin/recoil-overlay.exe --title "Recoil Practice $env:GITHUB_REF_NAME" --notes "SHA-256 of recoil-overlay.exe: $hash" --generate-notes
